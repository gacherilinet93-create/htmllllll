<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="static/css/form.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>create account</title>
</head>
<body>
    <div class="container">
        <div class="logo">CI</div>
        <h1>create account</h1>
        <p class="subtitle">join us today and get started</p>
        <form action="" method="post">
        <div class="input-group">
            <label for="Full name">Full name</label>
            <input type="full name" id="full name" name="full name"
            placeholder="Enter your name">
        </div>
        <div class="input-group">
        <label for="Email">Email adress</label>
        <input type="email" id="email adress" name="email adress"
        placeholder="enter email adress">
        </div>
        <div class="input-group">
            <label for="Password"> Password</label>
            <input type="text" id="pass" name="pass"
            placeholder="Enter password">
        </div>
        <div class="input-group">
            <label for="Confirm password">Confirm password</label>
            <input type="text" id="confirm password" name="confirm password"
            placeholder="confirm password">
        </div>

        <div class="terms">
         <input type="checkbox" id="terms" required>
         <label for="terms">I agree to the terms and conditions</label>
        </div>
        <button type="submit">create account</button>
        </form>
        <p class="login">Already have an account? <a href="">login</a></p>
    </div>
    
</body>
</html>
