<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list</title>
</head>
<body>
  <h1>list</h1>  
  <h2>ordered list</h2>
  <h1>list of countries</h1>
  <ol>
    <li>kenya</li>
    <li>burundi</li>
    <li>somalia</li>
    <li>rwanda</li>
    <li>burundi</li>
    <li>uganda</li>
  </ol>
  <h1>unordered list</h1>
  <h2>list of fruits</h2>
  <ul>
    <li>apple</li>
    <li>banana</li>
    <li>grapes</li>
    <li>oranges</li>
    <li>strawberry</li>
  </ul>
  <h2>description list</h2>
  <dl>
    <dt>apple</dt>
    <dd>a round fruit with red skin.</dd>
    <dt>banana</dt>
    <dd>a long fruit with yellow skin</dd>
  </dl>
</body>
</html>
